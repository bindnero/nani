[package]
name = "nani"
version = "0.1.0"
description = "Nani - an open-source desktop UI for the locally installed Claude Code CLI"
authors = ["Nani contributors"]
edition = "2021"
license = "MIT"
repository = ""
rust-version = "1.77.2"

[lib]
name = "nani_lib"
# Desktop-only build: `rlib` is enough. The `cdylib`/`staticlib` crate types are
# only required for mobile targets and overflow GNU `ld` export ordinals on
# Windows.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "7"
opener = "0.8"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
# This feature is used for production builds where `devUrl` is not available.
custom-protocol = ["tauri/custom-protocol"]
